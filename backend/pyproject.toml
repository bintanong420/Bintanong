[project]
name = "bintanong-backend"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = []

[project.optional-dependencies]
api = [
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "janus-swi==1.5.3",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
]
embedding = [
  "fastapi==0.141.1",
  "numpy==2.5.3",
  "pydantic==2.13.5",
  "sentence-transformers==6.1.0",
  "torch==2.14.0",
  "uvicorn==0.53.0",
]
tools = [
  "docling==2.129.0",
  "reportlab==5.0.1",
  "typer==0.26.8",
]
# OCR bake-off (plans/2026-10-04-prospectus-ocr-measurement.md). Pick ONE of the two: onnxruntime and
# onnxruntime-gpu own the same Python module and cannot coexist. macOS has no CUDA: use ocr-cpu there.
# Setup: scripts/fetch_tessdata.py plus the Tesseract program (see the plan, "Setup from a clean clone").
ocr-gpu = [
  "onnxruntime-gpu[cuda,cudnn]==1.30.0; sys_platform == 'win32' or sys_platform == 'linux'",
  "torch==2.14.0",
  "torchvision==0.29.0",
]
ocr-cpu = [
  "onnxruntime==1.30.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "api" },
    { extra = "embedding" },
  ],
  [
    { extra = "ocr-gpu" },
    { extra = "ocr-cpu" },
  ],
]

# CUDA 13.0 wheels (driver 616.86 reports CUDA 13.4; onnxruntime-gpu 1.30.0 targets CUDA 13.0).
# Used only for the ocr-gpu extra on Windows and Linux; macOS and every other extra keep PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# CPU wheels for ocr-cpu on Linux: PyPI's Linux torch drags in the whole CUDA stack (several GB), which a
# CPU image does not need. Windows and macOS PyPI wheels are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "ocr-gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cpu", extra = "ocr-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "ocr-gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
  { index = "pytorch-cpu", extra = "ocr-cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
markers = ["gpu: needs a CUDA device and the ocr-gpu extra (skipped when none is found)"]
